name: Company v1 tests

on:
  push:
    branches:
      - company/full-feature-transplant-v1
      - company/scene-cast-structured-story-v2
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            output=$(grep -n -B 12 -A 28 '^not ok' test-output.log | tail -n 240)
            if [ -z "$output" ]; then output=$(tail -n 120 test-output.log); fi
            output=${output//'%'/'%25'}
            output=${output//$'\r'/'%0D'}
            output=${output//$'\n'/'%0A'}
            echo "::error title=Regression failure blocks::$output"
          fi
          exit "$status"
      - name: API Worker dry-run
        run: npx --yes wrangler deploy --dry-run --config wrangler.api.jsonc
      - name: Frontend Worker dry-run
        run: npx --yes wrangler deploy --dry-run --config wrangler.frontend.jsonc
